<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Notas 2026 - ProfeDiego</title>
    
    <!-- Fuentes Google -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;900&display=swap" rel="stylesheet">
    
    <!-- ESTILOS GLOBALES -->
    <link rel="stylesheet" href="https://merunaku.github.io/home/styles.css">

    <!-- CONFIGURACIÓN Y HEADER GLOBAL -->
    <script src="https://merunaku.github.io/home/config.js"></script>
    <script src="https://merunaku.github.io/home/header.js"></script>

    <style>
        /* ==========================================================================
           ESTILOS ESPECÍFICOS DE LA CALCULADORA (Mantenidos)
           ========================================================================== */
        
        /* Sobrescribimos el pseudo-elemento de la tarjeta global para usar el color dinámico */
        .card::before {
            background: var(--state-color, var(--primary-color)) !important;
            transition: background 0.4s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 35px 70px -10px rgba(var(--state-color-rgb, 0, 43, 92), 0.18);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 22px;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 700;
            color: #4b5563;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Inputs interactivos y amigables */
        .input-group input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 2.5px solid #e5e7eb;
            border-radius: 16px;
            font-size: 1.3rem;
            font-weight: 900;
            text-align: center;
            color: #1f2937;
            box-sizing: border-box;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: #f9fafb;
        }

        .input-group input:focus {
            border-color: var(--state-color, var(--primary-color));
            background-color: #ffffff;
            box-shadow: 0 0 0 5px rgba(var(--state-color-rgb, 0, 43, 92), 0.18);
            outline: none;
            transform: scale(1.04);
        }

        /* Checkbox optimizado con diseño llamativo */
        .checkbox-group {
            grid-column: span 2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background-color: #f0fdfa;
            padding: 16px;
            border-radius: 18px;
            border: 2px dashed #0d9488;
            transition: all 0.2s ease;
        }

        .checkbox-group:hover {
            background-color: #ccfbf1;
            transform: scale(1.01);
        }

        .checkbox-group input {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: #0d9488;
        }

        .checkbox-group label {
            font-size: 0.95rem;
            font-weight: 700;
            color: #115e59;
            cursor: pointer;
            user-select: none;
        }

        /* Sección de examen destacada con fondo cálido animado */
        .exam-section {
            grid-column: span 2;
            background: linear-gradient(135deg, #fffdf5 0%, #fef3c7 100%);
            border: 3px dashed #f59e0b;
            padding: 22px;
            border-radius: 22px;
            margin-top: 5px;
            display: none;
            animation: bounceIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounceIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .prediction-box {
            background-color: #ffffff;
            color: #b45309;
            padding: 14px;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 18px;
            border: 2px solid #fcd34d;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.08);
        }

        /* Cuadro de resultados dinámico de alta gama */
        .results-box {
            margin-top: 30px;
            padding: 25px;
            border-radius: 22px;
            background: #ffffff;
            border: 2.5px solid #e2e8f0;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.01);
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 14px;
            font-size: 1.05rem;
            font-weight: 700;
            color: #4b5563;
            align-items: center;
        }

        .result-row.total {
            font-size: 1.6rem;
            font-weight: 900;
            border-top: 3px dotted #cbd5e1;
            padding-top: 18px;
            margin-top: 18px;
            color: var(--state-color, var(--primary-color));
            transition: color 0.3s ease;
        }

        .alert-box {
            background-color: #eff6ff;
            color: #1e40af;
            padding: 14px;
            border-radius: 14px;
            font-size: 0.95rem;
            margin-top: 15px;
            display: none;
            text-align: center;
            font-weight: 700;
            border: 2px solid #bfdbfe;
        }

        /* Badges de estados */
        .badge {
            display: inline-block;
            padding: 10px 28px;
            border-radius: 50px;
            font-weight: 900;
            color: white;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
        }
        .badge.aprobado { background: linear-gradient(135deg, var(--success-color), #059669); }
        .badge.reprobado { background: linear-gradient(135deg, var(--error-color), #b91c1c); }
        .badge.proceso { background: linear-gradient(135deg, var(--secondary-color), #d97706); }
        
        @media (max-width: 480px) {
            .form-grid { grid-template-columns: 1fr; }
            .checkbox-group { grid-column: span 1; }
            .exam-section { grid-column: span 1; }
        }
    </style>
</head>

<body>

    <!-- Contenedor donde header.js inyectará el encabezado -->
    <div id="global-header"></div>

    <main class="container">
        <div class="card" id="main_card">
            <h2>✨ Simulador de Calificaciones</h2>
            
            <div class="form-grid">
                <div class="input-group">
                    <label for="epe1">📝 EPE 1 (25%)</label>
                    <input type="text" id="epe1" placeholder="Ej: 5.5" oninput="calcularNotas()">
                </div>
                <div class="input-group">
                    <label for="epe2">📝 EPE 2 (25%)</label>
                    <input type="text" id="epe2" placeholder="Ej: 6.0" oninput="calcularNotas()">
                </div>
                <div class="input-group">
                    <label for="epe3">📝 EPE 3 (30%)</label>
                    <input type="text" id="epe3" placeholder="Ej: 4.5" oninput="calcularNotas()">
                </div>
                <div class="input-group">
                    <label for="eva">📊 Promedio EVA (20%)</label>
                    <input type="text" id="eva" placeholder="Ej: 5.0" oninput="calcularNotas()">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="epe2_nucleo" onchange="calcularNotas()">
                    <label for="epe2_nucleo">📌 Marcar si la EPE 2 es Evaluación Núcleo</label>
                </div>

                <div class="exam-section" id="exam_wrapper">
                    <div id="prediction_msg" class="prediction-box"></div>
                    <div class="input-group" style="max-width: 250px; margin: 0 auto;">
                        <label for="examen" style="color: #b45309; font-weight:900; text-align: center;">🎯 Tu Nota del Examen (30%)</label>
                        <input type="text" id="examen" placeholder="Ej: 4.0" oninput="calcularNotas()">
                    </div>
                </div>
            </div>

            <div class="results-box">
                <div class="result-row">
                    <span>Promedio Presentación (70%):</span>
                    <span id="res_presentacion" style="font-weight:900; color:#1e2937;">-</span>
                </div>
                <div class="result-row" id="row_reemplazo" style="display:none; color: #0d9488; font-size: 0.95rem; font-weight: bold;">
                    <span>🎉 ¡Nota reemplazada por Examen!:</span>
                    <span id="res_details_reemplazo">-</span>
                </div>
                <div class="result-row total">
                    <span>Nota Final Asignatura:</span>
                    <span id="res_final">-</span>
                </div>
                <div class="result-row" style="margin-top: 20px; justify-content: center;">
                    <span id="res_estado" class="badge proceso">Ingresar notas base</span>
                </div>
                <div class="alert-box" id="msg_redondeo"></div>
            </div>

            <a href="https://merunaku.github.io/home/index.html" class="btn-home">
                🏠 Volver al Portal de Estudios
            </a>
        </div>
    </main>

    <script>
        // Funciones de Lógica de la Calculadora (Mantenidas Intactas)
        function limpiarYFormatearNota(valor) {
            if (!valor) return 0;
            let str = valor.toString().trim().replace(',', '.');
            let num = parseFloat(str);
            if (isNaN(num)) return 0;
            if (num > 10 && num <= 70) {
                num = num / 10;
            }
            return (num >= 1.0 && num <= 7.0) ? num : 0;
        }

        function actualizarColorEstado(colorHex, colorRgb) {
            const root = document.documentElement;
            root.style.setProperty('--state-color', colorHex);
            root.style.setProperty('--state-color-rgb', colorRgb);
        }

        function calcularNotas() {
            let epe1 = limpiarYFormatearNota(document.getElementById('epe1').value);
            let epe2 = limpiarYFormatearNota(document.getElementById('epe2').value);
            let epe3 = limpiarYFormatearNota(document.getElementById('epe3').value);
            let eva = limpiarYFormatearNota(document.getElementById('eva').value);
            let epe2Nucleo = document.getElementById('epe2_nucleo').checked;
            let examenInput = document.getElementById('examen');
            let examen = limpiarYFormatearNota(examenInput.value);

            let examWrapper = document.getElementById('exam_wrapper');
            let predictionMsg = document.getElementById('prediction_msg');
            let msgRedondeo = document.getElementById('msg_redondeo');
            let rowReemplazo = document.getElementById('row_reemplazo');
            
            msgRedondeo.style.display = "none";
            rowReemplazo.style.display = "none";

            if (!epe1 || !epe2 || !epe3 || !eva) {
                document.getElementById('res_presentacion').innerText = "-";
                document.getElementById('res_final').innerText = "-";
                document.getElementById('res_estado').className = "badge proceso";
                document.getElementById('res_estado').innerText = "Ingresar notas base";
                examWrapper.style.display = "none";
                actualizarColorEstado('#002b5c', '0, 43, 92'); 
                return;
            }

            // 1. Promedio de presentación base
            let promPresentacionOriginal = (epe1 * 0.25) + (epe2 * 0.25) + (epe3 * 0.30) + (eva * 0.20);
            
            // Criterio de eximición (4.95 sube a 5.0)
            let promPresentacionFinal = promPresentacionOriginal;
            let fueRedondeadoEximicion = false;
            if (promPresentacionOriginal >= 4.95 && promPresentacionOriginal < 5.0) {
                promPresentacionFinal = 5.0;
                fueRedondeadoEximicion = true;
            } else {
                promPresentacionFinal = Math.round(promPresentacionOriginal * 10) / 10;
            }

            document.getElementById('res_presentacion').innerText = promPresentacionFinal.toFixed(1);

            // 2. Condición de Eximición
            if (promPresentacionFinal >= 5.0) {
                examWrapper.style.display = "none";
                examenInput.value = ""; 
                document.getElementById('res_final').innerText = promPresentacionFinal.toFixed(1);
                document.getElementById('res_estado').className = "badge aprobado";
                document.getElementById('res_estado').innerText = "¡Eximido! Asignatura Aprobada 🎉";
                actualizarColorEstado('#16a34a', '22, 163, 74'); 
                
                if (fueRedondeadoEximicion) {
                    msgRedondeo.innerText = "✨ ¡Nota aproximada de " + promPresentacionOriginal.toFixed(2) + " a 5.0 para otorgar la eximición!";
                    msgRedondeo.style.display = "block";
                }
                return;
            }

            // 3. Activar Examen y Calcular Nota Predictiva Necesaria (Aprobar con un 3.95 final)
            examWrapper.style.display = "block";
            actualizarColorEstado('#f4b223', '244, 178, 35'); 
            
            let notaNecesaria = 0;
            let aproboConPrediccion = false;

            for (let notaSimulada = 1.0; notaSimulada <= 7.0; notaSimulada = parseFloat((notaSimulada + 0.1).toFixed(1))) {
                let epe1Sim = epe1, epe2Sim = epe2, epe3Sim = epe3;
                
                let listaCandidatos = [
                    { id: 1, nota: epe1, pond: 0.25 },
                    { id: 3, nota: epe3, pond: 0.30 }
                ];
                if (!epe2Nucleo) {
                    listaCandidatos.push({ id: 2, nota: epe2, pond: 0.25 });
                }
                listaCandidatos.sort((a, b) => (a.nota !== b.nota) ? a.nota - b.nota : b.pond - a.pond);
                let peorEpe = listaCandidatos[0];

                if (notaSimulada > peorEpe.nota) {
                    if (peorEpe.id === 1) epe1Sim = notaSimulada;
                    if (peorEpe.id === 2) epe2Sim = notaSimulada;
                    if (peorEpe.id === 3) epe3Sim = notaSimulada;
                }

                let presModificada = (epe1Sim * 0.25) + (epe2Sim * 0.25) + (epe3Sim * 0.30) + (eva * 0.20);
                let finalPrevia = (presModificada * 0.70) + (notaSimulada * 0.30);

                if (finalPrevia >= 3.95) {
                    notaNecesaria = notaSimulada;
                    aproboConPrediccion = true;
                    break;
                }
            }

            if (aproboConPrediccion) {
                predictionMsg.innerHTML = "🎯 Nota mínima necesaria en el Examen para aprobar: <strong>" + notaNecesaria.toFixed(1) + "</strong>";
            } else {
                predictionMsg.innerHTML = "⚠️ Matemáticamente no es posible alcanzar el 4.0 de aprobación incluso obteniendo un 7.0 en el examen.";
            }

            // 4. Lógica tradicional si ingresan nota real de examen
            if (!document.getElementById('examen').value) {
                document.getElementById('res_final').innerText = "-";
                document.getElementById('res_estado').className = "badge proceso";
                document.getElementById('res_estado').innerText = "Rinde Examen ⏱️";
                return;
            }

            let epe1Obj = { id: 1, nota: epe1, pond: 0.25, nombre: 'EPE 1' };
            let epe2Obj = { id: 2, nota: epe2, pond: 0.25, nombre: 'EPE 2' };
            let epe3Obj = { id: 3, nota: epe3, pond: 0.30, nombre: 'EPE 3' };

            let candidatosReales = [epe1Obj, epe3Obj];
            if (!epe2Nucleo) candidatosReales.push(epe2Obj);

            candidatosReales.sort((a, b) => (a.nota !== b.nota) ? a.nota - b.nota : b.pond - a.pond);
            let masBajaReal = candidatosReales[0];

            let notaEpe1Final = epe1, notaEpe2Final = epe2, notaEpe3Final = epe3;

            if (examen > masBajaReal.nota) {
                if (masBajaReal.id === 1) notaEpe1Final = examen;
                if (masBajaReal.id === 2) notaEpe2Final = examen;
                if (masBajaReal.id === 3) notaEpe3Final = examen;

                rowReemplazo.style.display = "flex";
                document.getElementById('res_details_reemplazo').innerText = masBajaReal.nombre + " (" + masBajaReal.nota.toFixed(1) + " → " + examen.toFixed(1) + ")";
            }

            let promPresentacionModificado = (notaEpe1Final * 0.25) + (notaEpe2Final * 0.25) + (notaEpe3Final * 0.30) + (eva * 0.20);
            let notaFinalPrevia = (promPresentacionModificado * 0.70) + (examen * 0.30);
            
            let notaFinalDefinitiva = notaFinalPrevia;
            let fueRedondeadoAprobacion = false;
            if (notaFinalPrevia >= 3.95 && notaFinalPrevia < 4.0) {
                notaFinalDefinitiva = 4.0;
                fueRedondeadoAprobacion = true;
            } else {
                notaFinalDefinitiva = Math.round(notaFinalPrevia * 10) / 10;
            }

            document.getElementById('res_final').innerText = notaFinalDefinitiva.toFixed(1);

            if (notaFinalDefinitiva >= 4.0) {
                document.getElementById('res_estado').className = "badge aprobado";
                document.getElementById('res_estado').innerText = "Asignatura Aprobada 🎉";
                actualizarColorEstado('#16a34a', '22, 163, 74'); 
            } else {
                document.getElementById('res_estado').className = "badge reprobado";
                document.getElementById('res_estado').innerText = "Asignatura Reprobada 😢";
                actualizarColorEstado('#dc2626', '220, 38, 38'); 
            }

            if (fueRedondeadoAprobacion) {
                msgRedondeo.innerText = "✨ ¡Nota final aproximada automáticamente de " + notaFinalPrevia.toFixed(2) + " a 4.0 por cumplir el criterio de aprobación!";
                msgRedondeo.style.display = "block";
            }
        }
    </script>
</body>
</html>
